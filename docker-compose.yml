version: "3.8"

services:
  api:
    build: .
    ports:
      - "8003:8003"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003

  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    command: streamlit run dashboard/streamlit_app.py --server.port 8501